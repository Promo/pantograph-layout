name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build pages
        run: node src/build.mjs
      - name: Collect the site
        run: |
          mkdir -p _site
          cp -r index.html assets SKILL.md .nojekyll _site/
          for d in */; do
            if [ -f "$d/index.html" ] && [ "$d" != "assets/" ] && [ "$d" != "src/" ] && [ "$d" != "_site/" ]; then
              cp -r "$d" _site/
            fi
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
